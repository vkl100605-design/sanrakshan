openapi: 3.0.3
info:
  title: Sanrakshan Disaster Decision-Support Platform API
  description: >
    Production-grade API contracts for Sanrakshan: multi-source hazard ingestion,
    Bayesian confidence fusion, TMVN verification tasking, operator approvals,
    and simulated dispatch coordination.
  version: 1.0.0
  contact:
    name: Sanrakshan Engineering Team
    email: dev@sanrakshan.gov.in
servers:
  - url: http://localhost:8080/api/v1
    description: Spring Boot Backend API
  - url: http://localhost:8000
    description: ML Inference & SimPy Simulation Service
  - url: https://staging.sanrakshan.internal/api/v1
    description: Staging AWS Environment


paths:
  /health:
    get:
      summary: System Health and Dependency Check
      description: Returns the health status of the service and connected dependencies (PostgreSQL/PostGIS, Kafka, Neo4j, MinIO).
      tags:
        - Diagnostics
      responses:
        '200':
          description: All critical dependencies operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more critical dependencies unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /incidents:
    post:
      summary: Create or Merge Normalized Incident
      description: Ingests a validated observation or directly creates/updates a disaster incident record.
      tags:
        - Incidents
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Incident successfully recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

    get:
      summary: List Filtered Incidents
      description: Returns active or archived incidents filtered by hazard type, state, and geographic boundary.
      tags:
        - Incidents
      parameters:
        - name: hazardType
          in: query
          required: false
          schema:
            type: string
            enum: [FLOOD, WILDFIRE, URBAN_FIRE, SMOKE]
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [REPORTED, VERIFYING, REVIEW_READY, APPROVED, ADJUSTED, OVERRIDDEN, REJECTED, RESOLVED]
        - name: minConfidence
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0.0
            maximum: 1.0
      responses:
        '200':
          description: List of incidents matching filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'

  /incidents/{id}:
    get:
      summary: Get Incident by ID
      tags:
        - Incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /incidents/{id}/explanation:
    get:
      summary: Get Explainable Bayesian Confidence Snapshot
      description: Returns posterior probability, credible uncertainty interval, model version, and top contributing signals.
      tags:
        - Decision Support
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed explanation breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfidenceExplanation'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /verification-tasks/{id}/evidence:
    post:
      summary: Submit Field Verifier Evidence
      description: Submits geotagged photographic/video evidence and ground truth report from a field verifier.
      tags:
        - TMVN Verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEvidenceRequest'
      responses:
        '200':
          description: Evidence recorded successfully and queued for Bayesian fusion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceReceipt'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /decisions:
    post:
      summary: Record Operator Review Decision
      description: Operator approves, adjusts, overrides, or rejects a system recommendation. Immutable audit log appended.
      tags:
        - Operator Decisions
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '201':
          description: Decision successfully recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /ml/v1/simulation/scenarios:
    get:
      summary: List Available Disaster Simulation Scenarios
      description: Returns catalogue of discrete-event SimPy disaster scenarios (e.g. Mumbra Flood Escalation, Airoli Fire Staging).
      tags:
        - Simulation & TMVN
      responses:
        '200':
          description: List of available simulation scenarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationScenariosResponse'

  /ml/v1/simulation/run:
    post:
      summary: Execute Discrete-Event SimPy Scenario
      description: Runs real-time SimPy discrete-event simulation, computing verifier dispatch, Bayesian fusion updates, XAI attribution, and academic dispatch mobilization.
      tags:
        - Simulation & TMVN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRunRequest'
      responses:
        '200':
          description: Simulation timeline, event log, XAI explanations, and dispatch plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRunResult'

  /ml/v1/tmvn/route:
    post:
      summary: Calculate Disaster Corridor Route
      description: Computes NetworkX Dijkstra shortest path with dynamic flood/fire hazard traversal penalties.
      tags:
        - Simulation & TMVN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Optimal path and road segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResult'

  /ml/v1/tmvn/rank:
    post:
      summary: Rank Verifier Candidates for Incident
      description: Multi-criteria ranking across proximity, hazard capability, trust rating, and road congestion.
      tags:
        - Simulation & TMVN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifierRankRequest'
      responses:
        '200':
          description: Ranked candidate verifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierRankResult'

  /ml/v1/dispatch/plan:
    post:
      summary: Generate Multi-Agency Dispatch Plan
      description: Generates simulated multi-agency mobilization recommendations (NDRF, Fire, EMS) with academic simulation boundary notice.
      tags:
        - Simulation & TMVN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchPlanRequest'
      responses:
        '200':
          description: Mobilization plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchPlanResult'

  /ml/v1/fusion/posterior:
    post:
      summary: Perform Bayesian Confidence Fusion
      description: Computes conjugate Beta-Binomial posterior probability, credible intervals, and entropy.
      tags:
        - Decision Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosteriorFusionRequest'
      responses:
        '200':
          description: Calibrated posterior distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfidenceExplanation'


components:
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Distributed trace correlation identifier
      schema:
        type: string
        format: uuid
        example: "c79b6348-12e0-4a81-b519-74d6c6e3b5e1"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique client key to guarantee idempotent execution
      schema:
        type: string
        example: "idemp-9941a3-2849"

  responses:
    BadRequestError:
      description: Invalid request payload or parameter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: Authentication required or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: User does not possess the required RBAC role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: Conflict with existing state or concurrent modification
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: "https://sanrakshan.gov.in/errors/not-found"
        title:
          type: string
          example: "Resource Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Incident with ID 'inc-123' does not exist."
        instance:
          type: string
          example: "/api/v1/incidents/inc-123"
        correlationId:
          type: string
          example: "c79b6348-12e0-4a81-b519-74d6c6e3b5e1"
        timestamp:
          type: string
          format: date-time
          example: "2026-09-25T14:15:30Z"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        version:
          type: string
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          properties:
            database:
              type: string
              example: "UP (PostgreSQL 16.3 + PostGIS 3.4)"
            kafka:
              type: string
              example: "UP"
            neo4j:
              type: string
              example: "UP"
            storage:
              type: string
              example: "UP (MinIO S3)"

    GeoPoint:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 12.9716
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 77.5946

    CreateIncidentRequest:
      type: object
      required:
        - hazardType
        - location
        - source
      properties:
        hazardType:
          type: string
          enum: [FLOOD, WILDFIRE, URBAN_FIRE, SMOKE]
        location:
          $ref: '#/components/schemas/GeoPoint'
        source:
          type: string
          example: "FIRMS_SATELLITE"
        severityHint:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        initialConfidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.65
        description:
          type: string
          example: "Elevated thermal anomaly detected in forest buffer zone"

    Incident:
      type: object
      properties:
        id:
          type: string
          example: "inc-2026-09-0012"
        hazardType:
          type: string
          example: "FLOOD"
        state:
          type: string
          example: "REVIEW_READY"
        location:
          $ref: '#/components/schemas/GeoPoint'
        confidence:
          type: number
          format: float
          example: 0.88
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConfidenceExplanation:
      type: object
      properties:
        incidentId:
          type: string
          example: "inc-2026-09-0012"
        posteriorProbability:
          type: number
          format: float
          example: 0.88
        credibleInterval:
          type: array
          items:
            type: number
            format: float
          example: [0.82, 0.94]
        modelVersion:
          type: string
          example: "pymc-hierarchical-v2.1"
        topSignals:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                example: "VERIFIER_EVIDENCE"
              weight:
                type: number
                example: 0.45
              observation:
                type: string
                example: "Geotagged image confirms 45cm street water depth"

    SubmitEvidenceRequest:
      type: object
      required:
        - location
        - mediaSha256
        - mediaStorageKey
        - observationText
      properties:
        location:
          $ref: '#/components/schemas/GeoPoint'
        mediaSha256:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        mediaStorageKey:
          type: string
          example: "evidence/inc-2026-09-0012/task-441/flood_depth.jpg"
        observationText:
          type: string
          example: "Flood depth 45cm at underpass; road blocked for two-wheelers"
        hazardObserved:
          type: boolean
          example: true

    EvidenceReceipt:
      type: object
      properties:
        evidenceId:
          type: string
          example: "evi-98124"
        taskId:
          type: string
          example: "task-441"
        status:
          type: string
          example: "SUBMITTED"
        receivedAt:
          type: string
          format: date-time

    RecordDecisionRequest:
      type: object
      required:
        - incidentId
        - action
        - justification
      properties:
        incidentId:
          type: string
          example: "inc-2026-09-0012"
        action:
          type: string
          enum: [APPROVE, ADJUST, OVERRIDE, REJECT]
        justification:
          type: string
          example: "Field verifier corroborated high depth with geotagged photo; issuing simulated boat team dispatch"
        adjustedConfidence:
          type: number
          format: float
          nullable: true
        simulatedDispatchPlan:
          type: object
          properties:
            unitTypes:
              type: array
              items:
                type: string
              example: ["INFLATABLE_RESCUE_BOAT", "PUMP_CREW_1"]
            designatedArea:
              type: string
              example: "Sector 4 Underpass"

    Decision:
      type: object
      properties:
        id:
          type: string
          example: "dec-1002"
        incidentId:
          type: string
        operatorId:
          type: string
          example: "op-varun-42"
        action:
          type: string
          example: "APPROVE"
        justification:
          type: string
        recordedAt:
          type: string
          format: date-time

    SimulationScenariosResponse:
      type: object
      properties:
        available_scenarios:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "FLOOD_MUMBRA_ESCALATION"
              name:
                type: string
                example: "Mumbra Creek Flood: Verifier Timeout & Automated Tier-2 Escalation"
              hazard_type:
                type: string
                example: "FLOOD"
              description:
                type: string

    SimulationRunRequest:
      type: object
      required:
        - scenario_id
      properties:
        scenario_id:
          type: string
          example: "FLOOD_MUMBRA_STANDARD"

    SimulationRunResult:
      type: object
      properties:
        scenario_id:
          type: string
          example: "FLOOD_MUMBRA_STANDARD"
        scenario_name:
          type: string
        hazard_type:
          type: string
        target_location:
          type: string
        total_sim_time_minutes:
          type: number
        initial_confidence:
          type: number
        final_posterior_confidence:
          type: number
        credible_interval:
          type: array
          items:
            type: number
        event_log:
          type: array
          items:
            type: object
            properties:
              sim_time_seconds:
                type: integer
              sim_time_formatted:
                type: string
              event_type:
                type: string
              headline:
                type: string
              details:
                type: string
        task_summary:
          type: object
        xai_explanation:
          type: object
        dispatch_plan:
          type: object
        operator_decision:
          type: object

    RouteRequest:
      type: object
      required:
        - origin_node
        - destination_node
      properties:
        origin_node:
          type: string
          example: "RETIBUNDER_CIRCLE"
        destination_node:
          type: string
          example: "MUMBRA_STATION"

    RouteResult:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
        total_distance_meters:
          type: integer
        total_travel_time_seconds:
          type: integer
        estimated_arrival_minutes:
          type: number
        route_status:
          type: string
          example: "OPTIMAL"
        path_nodes:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: object

    VerifierRankRequest:
      type: object
      required:
        - incident_node
        - hazard_type
      properties:
        incident_node:
          type: string
          example: "MUMBRA_STATION"
        hazard_type:
          type: string
          example: "FLOOD"

    VerifierRankResult:
      type: object
      properties:
        incident_node:
          type: string
        hazard_type:
          type: string
        ranked_candidates:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
              tier:
                type: integer
              composite_score:
                type: number
              verifier_id:
                type: string
              name:
                type: string
              eta_minutes:
                type: number

    DispatchPlanRequest:
      type: object
      required:
        - incident_id
        - hazard_type
        - target_node
      properties:
        incident_id:
          type: string
          example: "FLD-2847"
        hazard_type:
          type: string
          example: "FLOOD"
        target_node:
          type: string
          example: "MUMBRA_STATION"
        posterior_confidence:
          type: number
          example: 0.88
        water_depth_cm:
          type: number
          example: 45.0

    DispatchPlanResult:
      type: object
      properties:
        plan_id:
          type: string
        incident_id:
          type: string
        hazard_type:
          type: string
        severity:
          type: string
        evacuation_zone_radius_meters:
          type: integer
        transit_shelter_assigned:
          type: string
        total_mobilized_personnel:
          type: integer
        simulation_boundary_notice:
          type: string
        resources:
          type: array
          items:
            type: object

    PosteriorFusionRequest:
      type: object
      required:
        - signals
      properties:
        signals:
          type: array
          items:
            type: object
            required:
              - source_type
              - raw_score
              - weight
            properties:
              source_type:
                type: string
                example: "SATELLITE_FIRMS"
              raw_score:
                type: number
                example: 0.6
              weight:
                type: number
                example: 0.8
              description:
                type: string

