server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: sanrakshan-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanrakshan_db}
    username: ${SPRING_DATASOURCE_USERNAME:sanrakshan_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_dev_password_change_in_prod}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

sanrakshan:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET_NAME:sanrakshan-evidence}
