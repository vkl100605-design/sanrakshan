name: Sanrakshan Continuous Integration & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Service (Spring Boot 3 + Java 21)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Build & Unit/Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and execute test suites
        run: mvn -B clean test

  # ---------------------------------------------------------------------------
  # 2. ML & Bayesian Fusion Service (Python 3.11)
  # ---------------------------------------------------------------------------
  ml-services-ci:
    name: ML Service Lint & Bayesian Fusion Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-services
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff static analysis & code style check
        run: ruff check src tests

      - name: Run PyTest suite
        run: pytest -v

  # ---------------------------------------------------------------------------
  # 3. Operator Command Dashboard PWA (React + Vite)
  # ---------------------------------------------------------------------------
  operator-pwa-ci:
    name: Operator PWA Build & Assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/operator-pwa
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/operator-pwa/package.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Verifier Mobile Portal PWA (React + Vite)
  # ---------------------------------------------------------------------------
  verifier-pwa-ci:
    name: Verifier PWA Build & Assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/verifier-pwa
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/verifier-pwa/package.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # 5. Security & Secret Leak Prevention SAST Scan
  # ---------------------------------------------------------------------------
  security-sast-scan:
    name: Security SAST & Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify zero unencrypted secrets committed
        run: |
          echo "Scanning codebase for forbidden patterns and hardcoded secrets..."
          if grep -rnEi "(password|secret|api_key|token)[[:space:]]*[:=][[:space:]]*['\"][a-zA-Z0-9_]{8,}['\"]" \
             --exclude-dir={.git,node_modules,target,dist,.venv,venv} \
             --exclude="*.example" \
             --exclude="*.md" .; then
            echo "::error::Potential hardcoded secret discovered! Aborting."
            exit 1
          fi
          echo "No hardcoded secrets detected."
